      html, body {
        background-color: #10182b !important;
        background-image:
          linear-gradient(to bottom, rgba(24, 15, 15, .6) 0%, rgba(15, 14, 22, .72) 48%, #10182b 68%, #10182b 100%),
          url('./assets/backgrounds/factory-background-extended.webp') !important;
        background-size: 100% 100%, 100% 100% !important;
        background-position: center top !important;
        background-repeat: no-repeat !important;
      }

      body::after {
        content: '';
        position: fixed;
        z-index: 0;
        inset: 67.45% 0 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 52% 0%, rgba(77, 96, 139, .2), transparent 58%),
          repeating-linear-gradient(90deg, transparent 0 170px, rgba(255, 255, 255, .02) 171px 172px),
          linear-gradient(#121c31, #09101f);
        border-top: 5px solid #495468;
      }

      .robotics-hud {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        font-family: 'Chakra Petch', sans-serif;
      }

      .robotics-hud-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      .robotics-hotspot {
        position: absolute;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: transparent;
        pointer-events: auto;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .robotics-hotspot:focus-visible {
        outline: 3px solid #fee714;
        outline-offset: 3px;
      }

      .game-shell {
        position: relative;
        z-index: 1;
        transform: scale(.95);
        transform-origin: top left;
      }

      .robotics-back { left: 0; top: 1.8%; width: 6.2%; height: 8.3%; }
      .robotics-sound { left: 78.25%; top: 2.8%; width: 3.85%; height: 6.7%; }

      /* The speaker is drawn into the frame art; when sound is off a crossed-out speaker covers it. */
      .robotics-sound__muted {
        position: absolute;
        inset: 22% 20%;
        display: none;
        place-items: center;
        border-radius: 50%;
        color: #e31fa4;
        background: #fff;
        pointer-events: none;
      }

      .robotics-sound__muted svg {
        width: 88%;
        height: 88%;
      }

      .sound-muted .robotics-sound__muted {
        display: grid;
      }

      /* Sound menu, as in The Great Chocolate Race: replay what Meera just said, or mute everything. */
      .robotics-sound-menu {
        position: absolute;
        left: calc(78.25% + 1.925%);
        top: calc(2.8% + 6.7% + 10px);
        z-index: 3;
        width: max(210px, 15vw);
        padding: 10px;
        display: grid;
        gap: 4px;
        border: 1px solid #f5c44d;
        border-radius: 14px;
        background: #c81b95;
        box-shadow: 0 16px 30px rgba(0, 0, 0, .38);
        transform: translateX(-50%);
        pointer-events: auto;
        animation: robotics-sound-menu-in 160ms ease-out;
      }

      .robotics-sound-menu[hidden] {
        display: none;
      }

      .robotics-sound-menu::before {
        content: '';
        position: absolute;
        top: -6px;
        left: 50%;
        width: 10px;
        height: 10px;
        background: #f5c44d;
        transform: translateX(-50%) rotate(45deg);
      }

      .robotics-sound-menu button {
        min-height: 52px;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: transparent;
        font-family: 'Chakra Petch', 'Trebuchet MS', sans-serif;
        font-size: clamp(15px, 1.1vw, 18px);
        font-weight: 700;
        line-height: 1.15;
        text-align: left;
        cursor: pointer;
      }

      .robotics-sound-menu button:hover:not(:disabled),
      .robotics-sound-menu button:focus-visible {
        outline: none;
        background: rgba(255, 255, 255, .16);
      }

      .robotics-sound-menu button:disabled {
        opacity: .5;
        cursor: not-allowed;
      }

      .robotics-sound-menu__icon {
        width: 38px;
        height: 38px;
        flex: none;
        display: grid;
        place-items: center;
        border: 2px solid #fff;
        border-radius: 50%;
      }

      .robotics-sound-menu__icon svg {
        width: 20px;
        height: 20px;
      }

      /* The mute item shows the action it will take. */
      .robotics-sound-menu [data-icon="on"],
      .sound-muted .robotics-sound-menu [data-icon="off"] {
        display: none;
      }

      .sound-muted .robotics-sound-menu [data-icon="on"] {
        display: grid;
      }

      @keyframes robotics-sound-menu-in {
        from { opacity: 0; transform: translate(-50%, -6px); }
        to { opacity: 1; transform: translateX(-50%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .robotics-sound-menu { animation: none; }
      }

      .robotics-info { left: 83.0%; top: 2.8%; width: 3.85%; height: 6.7%; }
      .robotics-hint {
        left: .75%;
        bottom: .8%;
        width: 7.4%;
        height: 9.6%;
        border-radius: 50%;
        background: url('./assets/ui/robotics-hint.svg') center / contain no-repeat;
      }

      .robotics-hint[hidden] { display: none; }

      .robotics-timer {
        position: absolute;
        left: 89.82%;
        top: 3.42%;
        width: 7.05%;
        height: 5.35%;
        display: grid;
        place-items: center;
        color: #fff;
        font-family: 'Chakra Petch', sans-serif;
        font-size: clamp(15px, 2.02vw, 39.43px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0;
        text-align: center;
        pointer-events: none;
      }

      .robotics-progress {
        position: absolute;
        left: 97.09%;
        top: 32.76%;
        width: .92%;
        height: 44.75%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
      }

      .robotics-progress i {
        width: 100%;
        height: 8.82%;
        border-radius: 2px;
        background: #fff;
        opacity: .3;
        transition: opacity 180ms ease, filter 180ms ease;
      }

      .robotics-progress i.is-active {
        opacity: 1;
        filter: drop-shadow(0 0 5px rgba(255,255,255,.35));
      }

      /* The clock and the progress bar explain themselves when tapped (they are not in the tour). */
      .robotics-timer-hotspot { left: 89.3%; top: 2.6%; width: 8.1%; height: 7%; }
      .robotics-progress-hotspot { left: 95.9%; top: 31.5%; width: 3.3%; height: 47.2%; }

      .robotics-tip {
        position: absolute;
        max-width: min(300px, 70vw);
        padding: 10px 14px;
        border: 3px solid #fee714;
        border-radius: 14px;
        color: #102a4d;
        background: #fffdf8;
        box-shadow: 0 8px 18px rgba(0, 0, 0, .3);
        font-size: clamp(14px, 1.3vw, 18px);
        font-weight: 700;
        line-height: 1.3;
        pointer-events: none;
        opacity: 0;
        transition: opacity 160ms ease;
      }

      .robotics-tip.is-visible { opacity: 1; }
      .robotics-tip[hidden] { display: none; }

      .game-shell .global-controls > button {
        opacity: 0 !important;
        pointer-events: none !important;
      }

      .game-shell .primary-button {
        color: #fff !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: url('./assets/ui/robotics-button.svg') center / 100% 100% no-repeat !important;
        box-shadow: none !important;
        font-family: 'Chakra Petch', sans-serif !important;
        font-weight: 700 !important;
        letter-spacing: 0 !important;
        text-shadow: none !important;
        text-transform: uppercase !important;
        filter: drop-shadow(0 7px 8px rgba(0, 0, 0, .3));

        outline-offset: 3px;
      }

      .game-shell .line-control-bar {
        display: flex;
        justify-content: center;
      }

      .game-shell .run-controls {
        width: 100% !important;
      }

      .game-shell .run-buttons {
        width: 100%;
        justify-content: center;
      }

      .game-shell .run-button {

        min-height: 62px !important;

      .game-shell .rule-option:not(.is-correct):not(.is-wrong) {

        font-family: 'Chakra Petch', sans-serif !important;

    <script>
      (() => {
        const hud = document.getElementById('roboticsHud');
        const timer = hud.querySelector('.robotics-timer');
        const progress = hud.querySelector('.robotics-progress');
        const segments = [...progress.children];
        let elapsedMs = 0;
        let runningSince = 0;

        const visible = (element) => {
          if (!element || element.closest('#roboticsHud')) return false;
          const style = getComputedStyle(element);
          return !element.disabled && style.display !== 'none' && style.visibility !== 'hidden' && element.getClientRects().length > 0;
        };

        const firstVisible = (selectors) => {
          for (const selector of selectors) {
            const match = [...document.querySelectorAll(selector)].find(visible);
            if (match) return match;
          }
          return null;
        };

        const trigger = (selectors) => {
          const target = firstVisible(selectors);
          if (target) target.click();
        };

        hud.querySelector('.robotics-back').addEventListener('click', () => document.dispatchEvent(new Event('factory-ui-back')));
        const soundButton = hud.querySelector('.robotics-sound');
        const soundMenu = hud.querySelector('#soundMenu');
        const replayItem = soundMenu.querySelector('[data-sound-action="replay"]');
        const muteLabel = soundMenu.querySelector('.robotics-sound-menu__label');
        const soundIsOff = () => !!document.querySelector('.global-controls [aria-label="Turn sound on"]');
        const closeSoundMenu = (returnFocus) => {
          if (soundMenu.hidden) return;
          soundMenu.hidden = true;
          soundButton.setAttribute('aria-expanded', 'false');
          if (returnFocus) soundButton.focus();
        };
        const openSoundMenu = () => {
          muteLabel.textContent = soundIsOff() ? 'Turn sounds on' : 'Mute all sounds';
          replayItem.disabled = !(window.FactoryAudio && window.FactoryAudio.canReplay());
          soundMenu.hidden = false;
          soundButton.setAttribute('aria-expanded', 'true');
          soundMenu.querySelector('button:not(:disabled)').focus();
        };
        soundButton.addEventListener('click', () => (soundMenu.hidden ? openSoundMenu() : closeSoundMenu(false)));
        soundMenu.addEventListener('click', (event) => {
          const item = event.target instanceof Element && event.target.closest('[data-sound-action]');
          if (!item || item.disabled) return;
          if (item.dataset.soundAction === 'replay') window.FactoryAudio && window.FactoryAudio.replayNarration();
          else {
            const turnOff = !soundIsOff();
            trigger(['[aria-label="Mute sound"]', '[aria-label="Turn sound on"]']);
            // Apply it to the audio at once too, rather than waiting for the next frame's sync.
            if (window.FactoryAudio) window.FactoryAudio.setMuted(turnOff);
          }
          closeSoundMenu(true);
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !soundMenu.hidden) closeSoundMenu(true);
        });
        document.addEventListener('pointerdown', (event) => {
          if (!soundMenu.hidden && !(event.target instanceof Element && event.target.closest('.robotics-sound, #soundMenu'))) closeSoundMenu(false);
        }, true);
        hud.querySelector('.robotics-info').addEventListener('click', () => trigger(['[aria-label^="Help:"]']));
        hud.querySelector('.robotics-hint').addEventListener('click', () => trigger(['[aria-label*="hint" i]', '[aria-label^="Help:"]']));

        // HUD tips replace the tour stops for these controls. The clock and the progress bar have no other job,
        // so they explain themselves (with Meera's voice) on every tap; the speaker and the i only on the first tap.
        const tip = hud.querySelector('.robotics-tip');
        const tips = [
          { control: '.robotics-timer-hotspot', text: 'This clock shows how long you have been working. There is no rush!', voice: 'vo_tour_02_v2', every: true },
          { control: '.robotics-progress-hotspot', text: 'This bar shows how far you have come in the mission.', voice: 'vo_tour_03_v2', every: true, side: 'left' },
          // The sound menu opens below the speaker, so its tip sits to the left.
          { control: '.robotics-sound', text: 'Hear my last line again, or turn the sound off.', side: 'left' },
          { control: '.robotics-info', text: 'Station help: what each step does.' }
        ];
        let tipTimer = 0;
        const showTip = (control, text, side) => {
          window.clearTimeout(tipTimer);
          tip.textContent = text;
          tip.hidden = false;
          tip.classList.remove('is-visible');
          const box = control.getBoundingClientRect();
          const gap = 12;
          if (side === 'left') {
            tip.style.left = `${Math.max(12, box.left - gap - tip.offsetWidth)}px`;
            tip.style.top = `${Math.max(12, box.top + box.height / 2 - tip.offsetHeight / 2)}px`;
          } else {
            tip.style.left = `${Math.max(12, Math.min(window.innerWidth - tip.offsetWidth - 12, box.right - tip.offsetWidth))}px`;
            tip.style.top = `${box.bottom + gap}px`;
          }
          window.requestAnimationFrame(() => tip.classList.add('is-visible'));
          tipTimer = window.setTimeout(hideTip, 4500);
        };
        const hideTip = () => {
          window.clearTimeout(tipTimer);
          tip.classList.remove('is-visible');
          tip.hidden = true;
        };
        tips.forEach((entry) => {
          const control = hud.querySelector(entry.control);
          let shown = false;
          control.addEventListener('click', () => {
            if (shown && !entry.every) return;
            shown = true;
            showTip(control, entry.text, entry.side);
            if (entry.voice && window.FactoryAudio) window.FactoryAudio.say(entry.voice);
          });
        });
        document.addEventListener('pointerdown', (event) => {
          if (!tip.hidden && !(event.target instanceof Element && event.target.closest(tips.map((entry) => entry.control).join(',')))) hideTip();
        }, true);

        const progressFor = (shell) => {
          if (!shell) return 0;
          const phase = [...shell.classList].find((name) => name.startsWith('phase-'))?.slice(6) || 'intro';
          const candle = shell.classList.contains('factory-candle');
          const cupcake = shell.classList.contains('factory-cupcake');
          if (phase === 'intro') return 0;
          const base = cupcake ? 6 : candle ? 3 : 0;
          const offset = {
            start: 0,
            rule: 3,
            arrange: 1,
            running: 2,
            transfer: 1,
            failed: 2,
            repair: 2,
            success: 3,
            candle_success: 3,
            complete: 3
          }[phase] ?? 1;
          return Math.min(9, base + offset);
        };

        const sync = () => {
          const shell = document.querySelector('.game-shell');
          document.querySelectorAll('.global-controls > button').forEach((control) => {
            if (control.getAttribute('aria-hidden') !== 'true') control.setAttribute('aria-hidden', 'true');
            if (control.tabIndex !== -1) control.tabIndex = -1;
          });
          soundButton.setAttribute('aria-label', soundIsOff() ? 'Sound options (sound is off)' : 'Sound options');
          const currentProgress = progressFor(shell);
          progress.setAttribute('aria-valuenow', String(currentProgress));
          segments.forEach((segment, index) => segment.classList.toggle('is-active', index >= segments.length - currentProgress));

          const phase = [...(shell?.classList || [])].find((name) => name.startsWith('phase-'))?.slice(6) || 'intro';
          hud.querySelector('.robotics-hint').hidden = !(phase === 'failed' && firstVisible(['.feedback-panel']));
          tick();
        };

        const tick = () => {
          const shell = document.querySelector('.game-shell');
          const phase = [...(shell?.classList || [])].find((name) => name.startsWith('phase-'))?.slice(6) || 'intro';
          const now = Date.now();
          // A new mission (first load or PLAY AGAIN) starts the clock from 00:00.
          if (phase === 'intro') {
            elapsedMs = 0;
            runningSince = 0;
          }
          const paused = ['intro', 'success', 'candle_success', 'complete'].includes(phase)
            || document.body.classList.contains('meera-booting')
            || document.body.classList.contains('meera-dialog-open')
            || document.body.classList.contains('factory-tutorial-open');
          if (paused && runningSince) {
            elapsedMs += now - runningSince;
            runningSince = 0;
          } else if (!paused && !runningSince) {
            runningSince = now;
          }
          const elapsedSeconds = Math.floor((elapsedMs + (runningSince ? now - runningSince : 0)) / 1000);
          const minutes = Math.floor(elapsedSeconds / 60);
          const seconds = elapsedSeconds % 60;
          timer.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        };

        new MutationObserver(sync).observe(document.getElementById('root'), { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'disabled', 'aria-hidden'] });
        document.addEventListener('factory-ui-timer-sync', tick);
        window.setInterval(tick, 1000);
        sync();
        tick();
      })();
    </script>
